# Early signal before the entry in the registry (ADR 0093 / K-2): while the versions are 0.0.x, only additive changes are
# allowed, and every public enum is #[non_exhaustive]. The gate itself is ONE implementation in fs-release
# (actions/semver-baseline): baseline = ALWAYS the newest version of the package in the registry `freesynergy`
# (unpacked .crate, --baseline-root), never a git tag; cargo-semver-checks (pinned, sha256 checked) lives in that action
# only, with `--release-type minor`. Three cases: registry reachable without a version of the package = green, the log
# says "no baseline: first registry version"; version present = compared with it; registry not reachable = RED with its
# own text. Red while fs-crates does not exist or has no first run is RIGHT, not a reason for an exception.
# `selftest` is the permanent counter-proof (the action has none for the real tool): it applies a small mutant (a public
# method made private) and a second one (a new variant in the exhaustive hand-written enum `ZoneKind`, ADR 0093 3a
# no. 4: the log must say `enum_variant_added`); it FAILS when cargo-semver-checks stays green on either (a tool that
# cannot go red is no gate). Both compare HEAD with the mutated tree (`--baseline-rev HEAD`), so no registry is needed.
# Both run on every tag, on every unreviewed/* push and by hand.
name: semver
on:
  push:
    tags: ["v*"]
    branches: ["unreviewed/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: FreeSynergy-Net/fs-release/actions/setup-rust@d6e6d2e9aff407b1232936d0666d0ec080b4360b
        with:
          cache-key: semver
      - name: semver fs-types
        uses: FreeSynergy-Net/fs-release/actions/semver-baseline@d6e6d2e9aff407b1232936d0666d0ec080b4360b
        with:
          package: fs-types
      - name: semver fs-conformance
        uses: FreeSynergy-Net/fs-release/actions/semver-baseline@d6e6d2e9aff407b1232936d0666d0ec080b4360b
        with:
          package: fs-conformance
      - name: semver fs-records
        uses: FreeSynergy-Net/fs-release/actions/semver-baseline@d6e6d2e9aff407b1232936d0666d0ec080b4360b
        with:
          package: fs-records

  selftest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: FreeSynergy-Net/fs-release/actions/setup-rust@d6e6d2e9aff407b1232936d0666d0ec080b4360b
        with:
          cache-key: semver
      - name: cargo-semver-checks from the action (install only, no check)
        id: tool
        uses: FreeSynergy-Net/fs-release/actions/semver-baseline@d6e6d2e9aff407b1232936d0666d0ec080b4360b
      - name: control (unchanged tree against HEAD must be green)
        env:
          SEMVER: ${{ steps.tool.outputs.semver-checks }}
        run: |
          set -euo pipefail
          "$SEMVER" semver-checks check-release --release-type minor --baseline-rev HEAD -p fs-types
      - name: mutant (a public method made private must be red)
        env:
          SEMVER: ${{ steps.tool.outputs.semver-checks }}
        run: |
          set +e -u
          sed -i 's/^    pub fn red(&self) -> u8 {/    fn red(\&self) -> u8 {/' crates/fs-types/src/color.rs
          git diff --quiet && { echo "selftest broken: the mutant did not apply"; exit 2; }
          "$SEMVER" semver-checks check-release --release-type minor --baseline-rev HEAD -p fs-types 2>&1 | tee "$RUNNER_TEMP/mutant.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ] && grep -q 'inherent_method_missing' "$RUNNER_TEMP/mutant.log"; then
            echo "selftest ok: the mutant was detected (rc=$rc, lint inherent_method_missing)"
          else
            echo "selftest FAILED: the mutant was NOT detected as a break (rc=$rc)"; exit 1
          fi
      - name: mutant 2 (a new variant in the exhaustive enum ZoneKind must be red, ADR 0093 3a no. 4)
        env:
          SEMVER: ${{ steps.tool.outputs.semver-checks }}
        run: |
          set +e -u
          git checkout -- .
          sed -i '/^pub enum ZoneKind {/,/^}/ s/^    Custom,$/    Custom,\n    ExtraMutant,/' crates/fs-types/src/moment.rs
          git diff --quiet && { echo "selftest broken: the mutant did not apply"; exit 2; }
          "$SEMVER" semver-checks check-release --release-type minor --baseline-rev HEAD -p fs-types 2>&1 | tee "$RUNNER_TEMP/mutant2.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ] && grep -q 'enum_variant_added' "$RUNNER_TEMP/mutant2.log"; then
            echo "selftest ok: the new variant was detected (rc=$rc, lint enum_variant_added)"
          else
            echo "selftest FAILED: the new variant in ZoneKind was NOT detected as a break (rc=$rc)"; exit 1
          fi
