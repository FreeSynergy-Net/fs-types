# ADR 0041: keep debug output small
[profile.dev]
debug = "line-tables-only"      # enough for backtraces, a fraction of full debug info
incremental = true

[profile.dev.package."*"]
debug = false                    # no debug info for dependencies

[profile.release]
debug = false
strip = "symbols"
lto = "thin"

# The registry of our crates (fs-release docs/crate-index.md): the one index string, the same everywhere.
[registries.freesynergy]
index = "https://github.com/FreeSynergy-Net/fs-crates"
